name: Build hardened container

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ubi9-jdk21-gradle8-hardened
      GRADLE_VERSION: 8.14.5
      GRADLE_SHA256: 6f74b601422d6d6fc4e1f9a1ab6522f642c2fdcbc15ae33ebd30ba3d7198e854
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --pull \
            --build-arg GRADLE_VERSION="${GRADLE_VERSION}" \
            --build-arg GRADLE_SHA256="${GRADLE_SHA256}" \
            -t "${IMAGE}:${GRADLE_VERSION}" \
            -f Dockerfile .

      - name: Verify image
        run: |
          ENGINE=docker IMAGE="${IMAGE}:${GRADLE_VERSION}" ./scripts/verify-image.sh

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.GRADLE_VERSION }}
          format: table
          vuln-type: os,library
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
